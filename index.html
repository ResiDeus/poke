<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon 8-Bit Battle: Anton vs Resi</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            image-rendering: pixelated;
        }

        body {
            background-color: #222;
            color: #000;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #music-notice {
            color: #fff;
            font-size: 10px;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.5;
            max-width: 480px;
        }

        #game-container {
            width: 480px;
            background-color: #f8f8f8;
            border: 8px solid #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #battle-screen {
            height: 280px;
            position: relative;
            background-color: #e0f8d0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-bottom: 6px solid #000;
        }

        .status-box {
            background: #f8f8f8;
            border: 4px solid #000;
            padding: 8px;
            width: 200px;
            font-size: 10px;
            position: absolute;
            z-index: 10;
        }

        .enemy-status {
            top: 16px;
            left: 16px;
        }

        .player-status {
            bottom: 24px;
            right: 16px;
        }

        .hp-container {
            display: flex;
            align-items: center;
            margin-top: 6px;
        }

        .hp-label {
            font-size: 8px;
            font-weight: bold;
            margin-right: 4px;
        }

        .hp-bar-border {
            border: 2px solid #000;
            width: 100%;
            height: 12px;
            background-color: #ccc;
            padding: 1px;
        }

        .hp-bar-fill {
            height: 100%;
            width: 100%;
            background-color: #4fe04f;
            transition: width 0.3s ease;
        }

        .hp-text {
            text-align: right;
            font-size: 8px;
            margin-top: 4px;
        }

        .sprite {
            position: absolute;
            width: 110px;
            height: 110px;
            object-fit: contain;
        }

        #enemy-sprite {
            top: 12px;
            right: 32px;
        }

        #player-sprite {
            bottom: 12px;
            left: 32px;
        }

        #menu-container {
            height: 120px;
            background-color: #f8f8f8;
            display: flex;
        }

        #dialogue-box {
            width: 50%;
            padding: 12px;
            font-size: 10px;
            line-height: 1.6;
            border-right: 4px solid #000;
            display: flex;
            align-items: center;
        }

        #action-box {
            width: 50%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 8px;
        }

        .btn-attack {
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            background-color: #f8f8f8;
            border: 3px solid #000;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-attack:hover {
            background-color: #000;
            color: #fff;
        }

        .btn-attack:disabled {
            background-color: #ccc;
            color: #777;
            cursor: not-allowed;
        }

        .damaged {
            animation: blink 0.15s linear infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="music-notice">
    Luego de perder en Fortnite
</div>

<div id="game-container">
    <div id="battle-screen">
        <div class="status-box enemy-status">
            <div>RESI</div>
            <div class="hp-container">
                <span class="hp-label">HP</span>
                <div class="hp-bar-border">
                    <div id="enemy-hp-bar" class="hp-bar-fill"></div>
                </div>
            </div>
            <div id="enemy-hp-text" class="hp-text">100/100</div>
        </div>

        <img id="enemy-sprite" class="sprite" src="resi.png" alt="Resi">
        <img id="player-sprite" class="sprite" src="anton.png" alt="Anton">

        <div class="status-box player-status">
            <div>ANTON</div>
            <div class="hp-container">
                <span class="hp-label">HP</span>
                <div class="hp-bar-border">
                    <div id="player-hp-bar" class="hp-bar-fill"></div>
                </div>
            </div>
            <div id="player-hp-text" class="hp-text">100/100</div>
        </div>
    </div>

    <div id="menu-container">
        <div id="dialogue-box">¡RESI salvaje apareció! ¿Qué hará ANTON?</div>
        <div id="action-box">
            <button class="btn-attack" onclick="playerTurn('dormir')">Dormir</button>
            <button class="btn-attack" onclick="playerTurn('manco power')">Manco Power</button>
            <button class="btn-attack" onclick="playerTurn('pellizcar')">Pellizcar</button>
            <button class="btn-attack" onclick="playerTurn('burlarse')">Burlarse</button>
        </div>
    </div>
</div>

<script>
    const player = { name: "ANTON", hp: 100, maxHp: 100 };
    const enemy = { name: "RESI", hp: 100, maxHp: 100, moves: ["enojarse", "tocar pasto", "try hardear", "ternura"] };
    let isGameActive = true;
    let audioCtx = null;
    let musicInterval = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startRetroMusic();
        }
    }

    function playTone(freq, type, duration, volume = 0.1) {
        if (!audioCtx) return;
        try {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        } catch(e) {
            console.error(e);
        }
    }

    function playSelectSound() {
        playTone(600, 'square', 0.08, 0.05);
        setTimeout(() => playTone(900, 'square', 0.08, 0.05), 40);
    }

    function playHitSound() {
        playTone(150, 'sawtooth', 0.2, 0.2);
        playTone(80, 'triangle', 0.3, 0.3);
    }
// 1. Creamos el objeto de audio apuntando a música de batalla real de Pokémon
const pokemonMusic = new Audio("https://nu.vgmtreasurechest.com/soundtracks/pokemon-pocket-monsters-sound-anime-collection/jqlzzgszrn/19.%20Attack%21.mp3"); 
pokemonMusic.loop = true;   // Hace que la música se repita sin parar
pokemonMusic.volume = 0.15; // Un volumen moderado para que no sature

// 2. Esta es tu nueva función startRetroMusic corregida
function startRetroMusic() {
    pokemonMusic.play().catch(error => {
        console.log("El navegador bloqueó el autoplay, se activará al hacer clic en un ataque.");
    });
}


    function updateUI() {
        const playerHpPct = (player.hp / player.maxHp) * 100;
        document.getElementById('player-hp-bar').style.width = playerHpPct + '%';
        document.getElementById('player-hp-text').innerText = player.hp + '/' + player.maxHp;
        changeBarColor(document.getElementById('player-hp-bar'), playerHpPct);

        const enemyHpPct = (enemy.hp / enemy.maxHp) * 100;
        document.getElementById('enemy-hp-bar').style.width = enemyHpPct + '%';
        document.getElementById('enemy-hp-text').innerText = enemy.hp + '/' + enemy.maxHp;
        changeBarColor(document.getElementById('enemy-hp-bar'), enemyHpPct);
    }

    function changeBarColor(barElement, percentage) {
        if (percentage <= 20) barElement.style.backgroundColor = '#e64a19';
        else if (percentage <= 50) barElement.style.backgroundColor = '#fbc02d';
        else barElement.style.backgroundColor = '#4fe04f';
    }

    function setButtonsDisabled(state) {
        document.querySelectorAll('.btn-attack').forEach(btn => btn.disabled = state);
    }

    function animateHit(targetId) {
        const sprite = document.getElementById(targetId);
        sprite.classList.add('damaged');
        playHitSound();
        setTimeout(() => sprite.classList.remove('damaged'), 600);
    }

    function playerTurn(move) {
        if (!isGameActive) return;
        initAudio(); 
        playSelectSound();
        setButtonsDisabled(true);

        const damage = Math.floor(Math.random() * (25 - 10 + 1)) + 10;
        enemy.hp = Math.max(0, enemy.hp - damage);
        
        let customText = '¡ANTON usó ' + move.toUpperCase() + '! ';
        if (move === 'dormir') customText += "Recuperó estilo pero igual recibió golpe.";
        if (move === 'manco power') customText += "¡El poder de la manquera atacó!";
        
        document.getElementById('dialogue-box').innerText = customText + ' Hizo ' + damage + ' de daño.';
        animateHit('enemy-sprite');
        updateUI();

                if (enemy.hp <= 0) {
            setTimeout(() => {
                document.getElementById('dialogue-box').innerText = "¡RESI se fue a llorar! ¡ANTON gana la batalla!";
                document.getElementById('enemy-sprite').style.display = 'none';
                isGameActive = false;
                pokemonMusic.pause(); // 👈 ¡Justo aquí también!
                playTone(440, 'square', 0.5, 0.1); // Sonido retro de victoria
            }, 1500);
            return;
        }


        setTimeout(enemyTurn, 1800);
    }

    function enemyTurn() {
        if (!isGameActive) return;

        const randomMove = enemy.moves[Math.floor(Math.random() * enemy.moves.length)];
        const damage = Math.floor(Math.random() * (25 - 10 + 1)) + 10;
        player.hp = Math.max(0, player.hp - damage);

        let customText = '¡RESI usó ' + randomMove.toUpperCase() + '! ';
        if (randomMove === 'tocar pasto') customText += "¡Te obligó a salir de la PC!";
        if (randomMove === 'try hardear') customText += "¡Se puso extremadamente tóxico!";
        if (randomMove === 'enojarse') customText += "¡Empezó a gritar por Discord!";
        if (randomMove === 'ternura') customText += "¡Te miró con ojos lindos y caíste!";

        document.getElementById('dialogue-box').innerText = customText + ' Hizo ' + damage + ' de daño.';
        animateHit('player-sprite');
        updateUI();

        if (player.hp <= 0) {
            setTimeout(() => {
                document.getElementById('dialogue-box').innerText = "¡ANTON se quedó dormido! RESI gana.";
                document.getElementById('player-sprite').style.display = 'none';
                isGameActive = false;
                pokemonMusic.pause();
            }, 1500);
            return;
        }

        setTimeout(() => {
            document.getElementById('dialogue-box').innerText = "¿Qué hará ANTON?";
            setButtonsDisabled(false);
        }, 1500);
    }

    updateUI();
</script>

</body>
</html>
